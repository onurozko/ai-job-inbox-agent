services:
  postgres:
    image: postgres:16-alpine
    container_name: jobinbox-postgres
    environment:
      POSTGRES_USER: jobinbox
      POSTGRES_PASSWORD: jobinbox
      POSTGRES_DB: jobinbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobinbox -d jobinbox"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
